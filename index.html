<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MangaPlus — منصة المانجا والروايات العربية</title>
    <meta
      name="description"
      content="MangaPlus منصة عربية لقراءة المانجا والروايات: اكتشف أعمالاً جديدة، تابع فصولك المفضلة، وأكمل القراءة من حيث توقفت."
    />
    <meta name="theme-color" content="#0B5CF0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/assets/fonts/plex-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/plex-arabic-700-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MangaPlus" />
    <meta property="og:title" content="MangaPlus — منصة المانجا والروايات العربية" />
    <meta
      property="og:description"
      content="اكتشف المانجا والروايات، تابع الفصول الجديدة، وأكمل القراءة من حيث توقفت على جميع أجهزتك."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MangaPlus — عالم المانجا والروايات بين يديك" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MangaPlus — منصة المانجا والروايات العربية" />
    <meta
      name="twitter:description"
      content="اكتشف المانجا والروايات، تابع الفصول الجديدة، وأكمل القراءة من حيث توقفت على جميع أجهزتك."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mangaplus.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>يتطلب موقع MangaPlus تفعيل JavaScript لعرض صفحاته.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
